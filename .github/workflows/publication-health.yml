name: Publication health (read-only)

# Standalone watchdog; never pushes, dispatches updates, or touches the server.
# GitHub cron can be delayed or dropped; this is not an external uptime SLA.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect published metadata
        run: python3 tools/check_freshness.py --max-age-minutes 65 --min-verified 20
