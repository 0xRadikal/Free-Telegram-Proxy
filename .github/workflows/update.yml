name: Update proxies

# Cadence. Primary: repository_dispatch from the server timer every 15 min.
# Fallback: GitHub cron. Ticks at :04/:19/:34/:49 avoid the top of the hour
# (documented high-load time when queued schedule jobs may be dropped) and,
# with the 13-min gate, give a 15-min cadence if the server is down
# (*/10 + 13-min gate simulated to 20 min). GitHub cron is best-effort:
# measured 0 schedule runs in the first ~5 h of this repo; the sibling repo
# Free-v2ray-Configs sees schedule runs every 2-6 h. The gate collapses
# cron + dispatch into one run.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the freshness gate"
        default: "false"
  repository_dispatch:
    types: [update-now]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

env:
  GATE_MINUTES: "13"
  DISPATCH_GATE_MINUTES: "8"
  OUT_MARK: "[auto-output]"
  # Everything the bot is allowed to write. Anything else changing between
  # the source anchor and the tip aborts the publish (never revert humans).
  OUTPUT_PATHS: "verified fast stable resilient faketls secure classic all countries top100.txt top50.txt index.json health.json state.json README.md README_FA.md README_RU.md"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Freshness gate
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ] || [ ! -f index.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A queued run's checkout can be stale if the run before it just
          # published, so read index.json from the remote tip.
          if git fetch -q --depth=1 origin main && git show origin/main:index.json > /tmp/idx.json 2>/dev/null; then :; else cp index.json /tmp/idx.json; fi
          last=$(python3 -c "import json;print(json.load(open('/tmp/idx.json')).get('updated_unix',0))")
          age=$(( ( $(date +%s) - last ) / 60 ))
          # repository_dispatch (server timer) gets a shorter gate so timer jitter
          # never skips it, but back-to-back triggers collapse to one run
          # (measured: dispatches 9 s apart queued two full runs before this).
          gate=$GATE_MINUTES
          [ "${{ github.event_name }}" = "repository_dispatch" ] && gate=$DISPATCH_GATE_MINUTES
          echo "index.json age: ${age} min (gate ${gate} min, event ${{ github.event_name }})"
          if [ "$age" -lt "$gate" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      # actions/checkout checks out the commit of the triggering EVENT, not the
      # branch tip. A run that waited in the `update` concurrency queue therefore
      # starts from the outputs as they were before the run ahead of it
      # published, and state.json (per-proxy history) is the one output read
      # back. Measured 2026-10-26: run 40370716618 queued behind 40370613057,
      # started from bdfb6b19 (state runs=1) and force-published 57118ef7 with
      # runs=2 over 15143441 (runs=2, 1797 proxies) — that run's history was
      # lost. The gate above stops short waits, but not a run ahead that lasts
      # past the gate (longest job measured: 12.6 min on 2026-10-30, gate 8 min
      # for dispatch) nor a forced run. Move to the newest publish when the two
      # commits differ only in OUTPUT_PATHS (the code is identical, so its
      # outputs are the newest valid ones). If the source differs, or the tip
      # cannot be read, keep the checkout — the outputs then match this code.
      - name: Sync outputs with the newest publish
        id: sync_outputs
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 3
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if ! timeout 60 git fetch --no-tags --force --depth=1 origin \
               +refs/heads/main:refs/remotes/origin/main; then
            echo "::warning title=Output sync skipped::could not fetch main — keeping the outputs of ${HEAD_SHA:0:8}"
            exit 0
          fi
          if ! TIP=$(git rev-parse --verify -q "refs/remotes/origin/main^{commit}"); then
            echo "::warning title=Output sync skipped::no main tip after the fetch — keeping the outputs of ${HEAD_SHA:0:8}"
            exit 0
          fi
          if [ "$TIP" = "$HEAD_SHA" ]; then
            echo "✅ checkout ${HEAD_SHA:0:8} is the newest main — nothing to sync"
            exit 0
          fi
          EXCLUDE=()
          for p in $OUTPUT_PATHS; do EXCLUDE+=(":(exclude)$p"); done
          if ! SOURCE_DIFF=$(git diff --no-renames --name-only "$HEAD_SHA" "$TIP" -- . "${EXCLUDE[@]}"); then
            echo "::warning title=Output sync skipped::could not compare ${HEAD_SHA:0:8} with ${TIP:0:8} — keeping the checkout"
            exit 0
          fi
          if [ -n "$SOURCE_DIFF" ]; then
            echo "::notice title=Output sync skipped::source changed since this run was triggered ($(echo "$SOURCE_DIFF" | head -5 | tr '\n' ' ')) — keeping the outputs that match this code"
            exit 0
          fi
          CHANGED=$(git diff --no-renames --name-only "$HEAD_SHA" "$TIP" | wc -l) || CHANGED="?"
          git reset -q --hard "$TIP"
          echo "🔄 queued run: outputs synced ${HEAD_SHA:0:8} → ${TIP:0:8} (${CHANGED} output files differ, source identical)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: GeoIP cache key
        if: steps.gate.outputs.run == 'true'
        id: geokey
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # A month's cache key must only ever hold that month's files. DB-IP
      # publishes them hours into the 1st (2026-11: Last-Modified 07:41 UTC).
      # The previous single `actions/cache` step saved whatever the first run
      # of the month had: run 41255477045 (2026-11-01 00:09 UTC) fell back to
      # "✓ country 2026-10" and saved it as `dbip-2026-11`, every later run
      # restored it, and all of November used October's GeoIP (642/642
      # published rows matched October's database, which differs from
      # November's on 12 countries and 11 ASNs). Now: restore this month's
      # key, or the newest older one (restore-keys); download this month when
      # it is not cached; save under this month's key ONLY when both files
      # are this month's. The key prefix is new, so the mislabelled
      # `dbip-2026-11` entry is never read again.
      - name: Restore DB-IP cache
        id: geocache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: dbip-v2-${{ steps.geokey.outputs.ym }}
          restore-keys: dbip-v2-

      - name: Download DB-IP Lite (country + ASN, CC BY 4.0)
        id: dbip
        if: steps.gate.outputs.run == 'true'
        env:
          YM: ${{ steps.geokey.outputs.ym }}
          CACHE_HIT: ${{ steps.geocache.outputs.cache-hit }}
          MATCHED: ${{ steps.geocache.outputs.cache-matched-key }}
        run: |
          set -uo pipefail
          mkdir -p .cache
          # Not `date -d 'last month'`: on the 31st GNU date returns the
          # current month (2026-12-31 → 2026-12). Count back from the 1st.
          PREV=$(date -u -d "$YM-01 -1 month" +%Y-%m)
          current=0
          for kind in country asn; do
            dest=".cache/dbip-$kind-lite.mmdb"
            have=false
            [ -s "$dest" ] && [ "$(stat -c%s "$dest")" -gt 1000000 ] && have=true
            if [ "$CACHE_HIT" = "true" ] && [ "$have" = true ]; then
              echo "✓ $kind $YM (cache)"; current=$((current + 1)); continue
            fi
            got=""
            for ym in "$YM" "$PREV"; do
              # An older copy restored from the cache is at least as new as PREV.
              [ "$ym" = "$PREV" ] && [ "$have" = true ] && break
              tmp=$(mktemp)
              if curl -fsSL --retry 3 --max-time 120 -o "$tmp" "https://download.db-ip.com/free/dbip-$kind-lite-$ym.mmdb.gz" \
                 && gunzip -c "$tmp" > "$dest.tmp" && [ "$(stat -c%s "$dest.tmp")" -gt 1000000 ]; then
                mv "$dest.tmp" "$dest"; got=$ym
              fi
              rm -f "$tmp" "$dest.tmp"
              [ -n "$got" ] && break
            done
            if [ "$got" = "$YM" ]; then
              echo "✓ $kind $YM"; current=$((current + 1))
            elif [ -n "$got" ]; then
              echo "::notice::DB-IP $kind $YM not available (not published yet?) — using $got"
            elif [ "$have" = true ]; then
              echo "::notice::DB-IP $kind $YM not available (not published yet?) — using the cached copy (${MATCHED:-unknown key})"
            else
              echo "::warning::DB-IP $kind unavailable — countries/ASN will be empty this run"
            fi
          done
          if [ "$current" -eq 2 ]; then echo "cacheable=true" >> "$GITHUB_OUTPUT"; else echo "cacheable=false" >> "$GITHUB_OUTPUT"; fi

      # Never fails the run: publishing must not depend on the cache service.
      - name: Save DB-IP cache
        if: steps.gate.outputs.run == 'true' && steps.geocache.outputs.cache-hit != 'true' && steps.dbip.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: dbip-v2-${{ steps.geokey.outputs.ym }}

      - name: Collect, probe, publish files
        id: collect
        if: steps.gate.outputs.run == 'true'
        run: python -m tgproxy --out .

      - name: Validate outputs (fail-closed)
        if: steps.gate.outputs.run == 'true'
        run: python tools/validate_outputs.py .

      - name: Size budget
        id: size
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p /tmp/out
          for p in $OUTPUT_PATHS; do [ -e "$p" ] && cp -r "$p" /tmp/out/; done
          python tools/check_size.py /tmp/out --report "$RUNNER_TEMP/output-size.json"

      - name: Preserve size failure diagnostics
        if: ${{ !cancelled() && steps.size.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-size-report
          path: |
            ${{ runner.temp }}/output-size.json
            index.json
            health.json
          retention-days: 7

      - name: Summary
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          i = json.load(open("index.json"))
          print("### Funnel\n")
          for k, v in i["funnel"].items():
              print(f"- **{k}**: {v}")
          print("\n### Tiers\n")
          for k, v in i["tiers"].items():
              print(f"- `{k}`: {v['count']} links / {v['servers']} servers")
          EOF

      # ── Rolling squash on main: history = source commits + ONE output commit.
      # Find newest non-output commit (anchor), build tree = anchor + outputs,
      # commit with parent=anchor, push with lease. Fail-closed on anything odd.
      - name: Publish (rolling squash)
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "tgproxy-bot"
          git config user.email "actions@users.noreply.github.com"
          # `local p`: the caller's loop below also uses $p; without it the
          # "source changed" message named the last OUTPUT_PATHS entry
          # (README_RU.md) instead of the files that actually changed.
          is_output() { local p; for p in $OUTPUT_PATHS; do case "$1" in "$p"|"$p"/*) return 0;; esac; done; return 1; }
          for f in index.json health.json verified/tg.txt resilient/tg.txt top100.txt top50.txt; do
            [ -s "$f" ] || { echo "❌ missing $f — not publishing"; exit 1; }
          done
          N=$(python3 -c "import json;print(json.load(open('index.json'))['funnel']['verified_links'])")
          SRV=$(python3 -c "import json;print(json.load(open('index.json'))['funnel']['verified_servers'])")
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags --force --depth=2 origin +refs/heads/main:refs/remotes/origin/main
            TIP=$(git rev-parse refs/remotes/origin/main)
            ANCHOR=""
            for d in 2 4 8 32 128; do
              [ "$d" -gt 2 ] && git fetch --no-tags --force --depth=$d origin +refs/heads/main:refs/remotes/origin/main || true
              ANCHOR=$(git log --format='%H%x09%s' "$TIP" | grep -v -F "$OUT_MARK" | head -1 | cut -f1 || true)
              [ -n "$ANCHOR" ] && break
            done
            [ -n "$ANCHOR" ] || { echo "❌ no source anchor"; exit 1; }
            REG=""
            if [ "$ANCHOR" != "$TIP" ]; then
              while IFS= read -r p; do [ -n "$p" ] && ! is_output "$p" && REG="$REG $p"; done <<< "$(git diff --name-only "$ANCHOR" "$TIP")"
            fi
            if [ -n "$REG" ]; then echo "⚠️ source changed between anchor and tip:$REG — retry"; sleep $((attempt*3)); continue; fi
            export GIT_INDEX_FILE="$(mktemp -u)"
            git read-tree "$ANCHOR"
            for p in $OUTPUT_PATHS; do git rm -r -f --cached -q --ignore-unmatch -- "$p" >/dev/null; done
            for p in $OUTPUT_PATHS; do [ -e "$p" ] && git add -f -- "$p"; done
            TREE=$(git write-tree); rm -f "$GIT_INDEX_FILE"; unset GIT_INDEX_FILE
            for must in tgproxy/__main__.py templates/README.md tools/check_size.py tools/validate_outputs.py .github/workflows/update.yml index.json; do
              git cat-file -e "$TREE:$must" || { echo "❌ $must missing from tree"; exit 1; }
            done
            if [ "$TREE" = "$(git rev-parse "$TIP^{tree}")" ]; then echo "no change"; exit 0; fi
            C=$(git commit-tree "$TREE" -p "$ANCHOR" -m "chore: update proxies — $(date -u +'%Y-%m-%d %H:%M UTC') — $N verified / $SRV servers $OUT_MARK")
            if git push --force-with-lease="refs/heads/main:$TIP" origin "$C:refs/heads/main"; then echo "✅ published $C"; exit 0; fi
            echo "lease rejected — retry"; sleep $((attempt*3))
          done
          echo "❌ could not publish"; exit 1

      - name: Purge jsDelivr
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          for f in top100.txt top50.txt resilient/tme.txt resilient/tg.txt resilient/proxies.json verified/tme.txt verified/tg.txt verified/proxies.json fast/tme.txt fast/proxies.json stable/proxies.json faketls/proxies.json secure/proxies.json classic/proxies.json index.json health.json; do
            curl -fsS -m 15 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" >/dev/null || true
          done
