name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["tgproxy/**", "tests/**", "requirements*.txt", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Unit + differential (real TDLib via tdjson) + live integration against
      # the pinned reference proxy and real Telegram DCs. Nothing is mocked.
      - run: python -m pytest -q
