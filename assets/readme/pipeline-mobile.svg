    <text x="40" y="776" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="18" font-weight="500" fill="#DBEBFF">Verification reflects the runner network, not every ISP.</text></g></svg>