<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 814" width="640" height="814" role="img" aria-label="Mobile MTProto verification flow"><style>@media (prefers-reduced-motion: reduce){.rm0{opacity:0!important}}</style>
<title>MTProto verification flow — mobile</title><desc>Five stages from proxy collection through Telegram DC verification and publishing.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#247EFD" /><stop offset="1" stop-color="#135CCF" /></linearGradient><clipPath id="panel"><rect width="640" height="814" rx="28" /></clipPath></defs>
<g clip-path="url(#panel)"><rect width="640" height="814" fill="url(#bg)" />
<text x="40" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="19" font-weight="760" letter-spacing="1.4" fill="#DBEBFF">MTProto VERIFICATION</text>
<text x="40" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="35" font-weight="800" fill="#EFF2F9">From source to verified</text>
