<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="312" viewBox="0 0 1280 312" role="img" aria-label="MTProto verification pipeline"><style>@media (prefers-reduced-motion: reduce){.rm0{opacity:0.5!important}.rm1{width:180px!important}.rm2{opacity:0!important}}</style>
<title>MTProto verification pipeline</title><desc>From public links through a real Telegram DC response to machine-readable outputs</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247EFD" /><stop offset=".58" stop-color="#2076F0" /><stop offset="1" stop-color="#135CCF" /></linearGradient>
<radialGradient id="cloud"><stop stop-color="#B4D8FF" stop-opacity=".24" /><stop offset="1" stop-color="#B4D8FF" stop-opacity="0" /></radialGradient>
<linearGradient id="sweep"><stop stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".12" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
<linearGradient id="edge"><stop stop-color="#EFF2F9" stop-opacity=".12" /><stop offset=".45" stop-color="#EFF2F9" stop-opacity=".8" /><stop offset="1" stop-color="#EFF2F9" stop-opacity=".12" /></linearGradient>
<clipPath id="round"><rect width="1280" height="312" rx="22" /></clipPath>
</defs><g clip-path="url(#round)">
<rect width="1280" height="312" fill="url(#bg)" />
<circle cx="192" cy="31" r="203" fill="url(#cloud)" opacity=".5" class="rm0"><animate attributeName="opacity" values=".34;.58;.34" dur="11s" repeatCount="indefinite" /></circle>
<circle cx="1190" cy="265" r="181" fill="url(#cloud)" opacity=".4" />
<path d="M32 290H1248" stroke="#EFF2F9" stroke-opacity=".12" />
<text x="44" y="49" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="790" fill="#DBEBFF" letter-spacing="1.8">THE VERIFICATION PIPELINE</text><text x="44" y="89" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="30" font-weight="800" fill="#EFF2F9">From collected links to verified MTProto</text><rect x="40" y="119" width="208" height="150" rx="17" fill="#EFF2F9" fill-opacity=".12" stroke="#EFF2F9" stroke-opacity=".30" />
<rect x="54" y="133" width="32" height="29" rx="10" fill="#EFF2F9" fill-opacity=".22" />
<text x="70" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">01</text><text x="97" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="780" fill="#EFF2F9" letter-spacing="0.6">COLLECT</text><text x="54" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="660" fill="#EFF2F9">Public proxy sources</text><text x="54" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="480" fill="#DBEBFF">No promises at import</text><rect x="54" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".16" /><rect x="54" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".9" class="rm1"><animate attributeName="width" values="0;180;180" keyTimes="0;.64;1" dur="5.5s" begin="0.0s" repeatCount="indefinite" /></rect><path d="M252 194H286" stroke="#EFF2F9" stroke-opacity=".50" stroke-width="2.2" /><path d="M281 188l6 6-6 6" stroke="#EFF2F9" stroke-opacity=".75" stroke-width="2.2" fill="none" stroke-linecap="round" /><circle cx="252" cy="194" r="3" fill="#EFF2F9" class="rm2"><animate attributeName="cx" values="252;286" dur="2.2s" begin="0.0s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.0s" repeatCount="indefinite" /></circle><rect x="290" y="119" width="208" height="150" rx="17" fill="#EFF2F9" fill-opacity=".12" stroke="#EFF2F9" stroke-opacity=".30" />
<rect x="304" y="133" width="32" height="29" rx="10" fill="#EFF2F9" fill-opacity=".22" />
<text x="320" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">02</text><text x="347" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="780" fill="#EFF2F9" letter-spacing="0.6">NORMALIZE</text><text x="304" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="660" fill="#EFF2F9">Parse secrets and DNS</text><text x="304" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="480" fill="#DBEBFF">Deduplicate endpoints</text><rect x="304" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".16" /><rect x="304" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".9" class="rm1"><animate attributeName="width" values="0;180;180" keyTimes="0;.64;1" dur="5.5s" begin="0.55s" repeatCount="indefinite" /></rect><path d="M502 194H536" stroke="#EFF2F9" stroke-opacity=".50" stroke-width="2.2" /><path d="M531 188l6 6-6 6" stroke="#EFF2F9" stroke-opacity=".75" stroke-width="2.2" fill="none" stroke-linecap="round" /><circle cx="502" cy="194" r="3" fill="#EFF2F9" class="rm2"><animate attributeName="cx" values="502;536" dur="2.2s" begin="0.42s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.42s" repeatCount="indefinite" /></circle><rect x="540" y="119" width="208" height="150" rx="17" fill="#EFF2F9" fill-opacity=".12" stroke="#EFF2F9" stroke-opacity=".30" />
<rect x="554" y="133" width="32" height="29" rx="10" fill="#EFF2F9" fill-opacity=".22" />
<text x="570" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">03</text><text x="597" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="780" fill="#EFF2F9" letter-spacing="0.6">VERIFY</text><text x="554" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="660" fill="#EFF2F9">Telegram DC reply</text><text x="554" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="480" fill="#DBEBFF">Three required rounds</text><rect x="554" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".16" /><rect x="554" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".9" class="rm1"><animate attributeName="width" values="0;180;180" keyTimes="0;.64;1" dur="5.5s" begin="1.1s" repeatCount="indefinite" /></rect><path d="M752 194H786" stroke="#EFF2F9" stroke-opacity=".50" stroke-width="2.2" /><path d="M781 188l6 6-6 6" stroke="#EFF2F9" stroke-opacity=".75" stroke-width="2.2" fill="none" stroke-linecap="round" /><circle cx="752" cy="194" r="3" fill="#EFF2F9" class="rm2"><animate attributeName="cx" values="752;786" dur="2.2s" begin="0.84s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.84s" repeatCount="indefinite" /></circle><rect x="790" y="119" width="208" height="150" rx="17" fill="#EFF2F9" fill-opacity=".12" stroke="#EFF2F9" stroke-opacity=".30" />
<rect x="804" y="133" width="32" height="29" rx="10" fill="#EFF2F9" fill-opacity=".22" />
<text x="820" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">04</text><text x="847" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="780" fill="#EFF2F9" letter-spacing="0.6">RANK</text><text x="804" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="660" fill="#EFF2F9">Uptime and diversity</text><text x="804" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="480" fill="#DBEBFF">Top 100 + tier filters</text><rect x="804" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".16" /><rect x="804" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".9" class="rm1"><animate attributeName="width" values="0;180;180" keyTimes="0;.64;1" dur="5.5s" begin="1.6500000000000001s" repeatCount="indefinite" /></rect><path d="M1002 194H1036" stroke="#EFF2F9" stroke-opacity=".50" stroke-width="2.2" /><path d="M1031 188l6 6-6 6" stroke="#EFF2F9" stroke-opacity=".75" stroke-width="2.2" fill="none" stroke-linecap="round" /><circle cx="1002" cy="194" r="3" fill="#EFF2F9" class="rm2"><animate attributeName="cx" values="1002;1036" dur="2.2s" begin="1.26s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.26s" repeatCount="indefinite" /></circle><rect x="1040" y="119" width="208" height="150" rx="17" fill="#EFF2F9" fill-opacity=".12" stroke="#EFF2F9" stroke-opacity=".30" />
<rect x="1054" y="133" width="32" height="29" rx="10" fill="#EFF2F9" fill-opacity=".22" />
<text x="1070" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">05</text><text x="1097" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="780" fill="#EFF2F9" letter-spacing="0.6">PUBLISH</text><text x="1054" y="201" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="660" fill="#EFF2F9">Raw links + JSON</text><text x="1054" y="227" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="480" fill="#DBEBFF">Readable dashboard</text><rect x="1054" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".16" /><rect x="1054" y="251" width="180" height="3" rx="1.5" fill="#EFF2F9" fill-opacity=".9" class="rm1"><animate attributeName="width" values="0;180;180" keyTimes="0;.64;1" dur="5.5s" begin="2.2s" repeatCount="indefinite" /></rect><text x="40" y="295" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="500" fill="#DBEBFF">Validation is from the runner network, not a guarantee of reachability from every ISP.</text></g></svg>