<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="50" viewBox="0 0 1280 50" role="img" aria-label="Raydikalx section divider"><style>@media (prefers-reduced-motion: reduce){.rm0{opacity:0!important}}</style>
